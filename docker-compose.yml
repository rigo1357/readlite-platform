name: readlite-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readlite}
      POSTGRES_USER: ${POSTGRES_USER:-readlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readlite_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - readlite

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-readlite}:${POSTGRES_PASSWORD:-readlite_local}@postgres:5432/${POSTGRES_DB:-readlite}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      READLITE_MEDIA_DIR: ${READLITE_MEDIA_DIR:-/var/lib/readlite/media}
      AI_REVIEW_PROVIDER: ${AI_REVIEW_PROVIDER:-}
      AI_REVIEW_API_URL: ${AI_REVIEW_API_URL:-}
      AI_REVIEW_API_KEY: ${AI_REVIEW_API_KEY:-}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-}
    volumes:
      - readlite_media:/var/lib/readlite/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - readlite

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - readlite

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - '${MAILPIT_HTTP_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - readlite

networks:
  readlite:
    driver: bridge

volumes:
  postgres_data:
  readlite_media:
